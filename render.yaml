services:
  - type: web
    name: intelligent-inventory-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: inventory_forecasting
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DEFAULT_FORECAST_HORIZON_DAYS
        value: "14"
      - key: DEFAULT_SAFETY_STOCK_Z_SCORE
        value: "1.65"
      - key: DEFAULT_LEAD_TIME_DAYS
        value: "7"
